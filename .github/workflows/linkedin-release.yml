name: Divulgar Release no LinkedIn
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag de uma Release estável já publicada
        required: true
        type: string
      publish:
        description: Enviar ao LinkedIn (desmarcado gera apenas prévia)
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: launchlens-linkedin-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  announce:
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Obter scripts da branch principal
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gerar prévia ou publicar
        env:
          GH_TOKEN: ${{ github.token }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ vars.LINKEDIN_AUTHOR_URN }}
          LINKEDIN_API_VERSION: ${{ vars.LINKEDIN_API_VERSION || '202610' }}
          LINKEDIN_ENABLED: ${{ vars.LINKEDIN_ENABLED }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          args=(--tag "$RELEASE_TAG")
          if [[ "$LINKEDIN_ENABLED" != "true" || ( "$EVENT_NAME" == "workflow_dispatch" && "$MANUAL_PUBLISH" != "true" ) ]]; then
            args+=(--dry-run)
          fi
          python scripts/publish_linkedin.py "${args[@]}"
