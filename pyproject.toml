[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "launchlens"
version = "1.0.0"
description = "Laboratório de ciência de dados para apoiar decisões de lançamento de aplicativos"
requires-python = ">=3.12,<3.14"
dependencies = ["numpy==2.3.5", "pandas==2.2.3", "scipy==1.17.0", "scikit-learn==1.8.0", "matplotlib==3.10.8", "joblib==1.5.3"]

[project.scripts]
launchlens = "launchlens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
